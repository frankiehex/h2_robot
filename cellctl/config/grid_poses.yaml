# 工作窗口网格放置点规范
# 每格 = 放置位姿 + 接近位姿 + 退出位姿 + 所属 zone。
# 全部为示教/离线编程结果（RoboDK 或各家官方仿真逐格验证后填入），
# 放置点不加视觉偏差（载具即定位基准）；视觉偏差只加在取料点上。
#
# 位姿格式: [x_mm, y_mm, z_mm, rx_deg, ry_deg, rz_deg]（工具坐标，基座系）
# 命名: R{row}C{col}，row 1 = 最靠近机器人的一行，col 1 = 左起第一列。
#
# 靠边列单独定义接近方向（左列从左上切入、右列从右上切入），
# 避免手腕别扭/近奇异点 —— 这是"每格独立示教"的意义所在。

S3_ham:
  # 取料点（视觉偏差 dx,dy,dθ 加在这里）
  pick:
    pose:     [420.0, -310.0, 45.0, 180.0, 0.0, 0.0]
    approach: [420.0, -310.0, 145.0, 180.0, 0.0, 0.0]
    retreat:  [420.0, -310.0, 145.0, 180.0, 0.0, 0.0]
    zones: [Z_S3_FEED]
  grid:
    R1C1:
      pose:     [250.0, -180.0, 60.0, 180.0, 0.0, 15.0]
      approach: [220.0, -200.0, 160.0, 180.0, 0.0, 15.0]   # 左列：左上方切入
      retreat:  [220.0, -200.0, 160.0, 180.0, 0.0, 15.0]
      zones: [Z_S3_GRID]
    R1C2:
      pose:     [250.0, -60.0, 60.0, 180.0, 0.0, 0.0]
      approach: [250.0, -60.0, 160.0, 180.0, 0.0, 0.0]
      retreat:  [250.0, -60.0, 160.0, 180.0, 0.0, 0.0]
      zones: [Z_S3_GRID]
    R1C3:
      pose:     [250.0, 60.0, 60.0, 180.0, 0.0, 0.0]
      approach: [250.0, 60.0, 160.0, 180.0, 0.0, 0.0]
      retreat:  [250.0, 60.0, 160.0, 180.0, 0.0, 0.0]
      zones: [Z_S3_GRID]
    R1C4:
      pose:     [250.0, 180.0, 60.0, 180.0, 0.0, -15.0]
      approach: [280.0, 200.0, 160.0, 180.0, 0.0, -15.0]   # 右列：右上方切入
      retreat:  [280.0, 200.0, 160.0, 180.0, 0.0, -15.0]
      zones: [Z_S3_GRID]
    # R2/R3 行：示教后按同样格式补齐（仅第 1 行作业时可留空，
    # 3 行深度跨节拍作业时需要 —— 见概念设计 §1.1）

S5_egg:
